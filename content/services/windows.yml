fullDescription: |
  Установка Windows — одна из самых востребованных услуг. Я выполняю чистую установку системы на любой компьютер или ноутбук, подходящий для работы Windows 10 или 11.

  **Что я делаю:**
  - Устанавливаю выбранную версию Windows (Home, Pro, Enterprise)
  - Настраиваю драйверы для всех устройств (видеокарта, сеть, звук и т.д.)
  - Выполняю базовые настройки безопасности и конфиденциальности
  - Устанавливаю необходимое программное обеспечение (браузер, офисный пакет, антивирус — по желанию)
  - Создаю учётные записи и настраиваю права доступа

  Работаю как с лицензионными ключами (вашими или подберу вариант), так и с установкой без лицензии — вы получаете полностью рабочую систему, а ключ активируете самостоятельно позже.

  **Важно:** перед установкой рекомендую сохранить важные данные на внешний носитель. Если нужна помощь с резервным копированием — сделаю это в рамках услуги.
