fullDescription: |
  Вирусы, трояны, майнеры и рекламное ПО не только замедляют работу компьютера, но и могут угрожать вашим данным. Я провожу полную диагностику и очистку системы с сохранением всех ваших файлов и настроек.

  **Что входит в работу:**
  - Глубокая проверка системы несколькими антивирусными сканерами
  - Удаление активных угроз и остаточных файлов
  - Очистка автозагрузки и планировщика задач
  - Восстановление настроек системы, изменённых вирусами (браузер, файлы hosts, реестр)
  - Консультация по профилактике заражений в будущем

  **Важно:** если система не загружается или вирус заблокировал доступ — работаю через безопасный режим или с загрузочной флешки. В сложных случаях может потребоваться установка системы (оговаривается отдельно).

  Работаю как очно, так и удалённо (при условии, что компьютер загружается и есть доступ в интернет).
